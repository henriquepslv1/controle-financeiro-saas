name: Extrair projeto V7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          set -e

          ZIP="controle-financeiro-saas-v7.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado."
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP" -d extracted

          echo "Conteúdo extraído:"
          find extracted -maxdepth 3 -type f | head -100

          if [ -f "extracted/package.json" ]; then
            cp -a extracted/. .
          else
            ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
              cp -a "$ROOT"/. .
            else
              echo "ERRO: package.json não encontrado após a extração."
              find extracted -maxdepth 4 -type f
              exit 1
            fi
          fi

          rm -rf extracted
          rm -f "$ZIP"

          echo "Estrutura final:"
          ls -la

          echo "package.json:"
          cat package.json

      - name: Salvar projeto no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Extrair projeto Controle Financeiro V7"
            git push
          fi
